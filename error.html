<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Lost In Orbit</title>
    <link rel="stylesheet" href="style2.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        .error-main-wrapper { min-height: 75vh; display: flex; align-items: center; justify-content: center; padding: 120px 20px 40px 20px; background-color: #ffffff; overflow: hidden; }
        .error-container { text-align: center; max-width: 600px; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .glitch-image-container { position: relative; width: 130px; height: 130px; margin-bottom: 25px; overflow: hidden; }
        .glitch-image { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: url('loading.png'); background-size: contain; background-repeat: no-repeat; background-position: center; }
        .glitch-image:nth-child(1) { animation: staticVideoImg 1.2s steps(2) infinite; }
        .glitch-image:nth-child(2) { animation: staticVideoImgShiftLeft 0.8s steps(1) infinite; opacity: 0.7; mix-blend-mode: color-burn; filter: hue-rotate(90deg) contrast(1.5); }
        .glitch-image:nth-child(3) { animation: staticVideoImgShiftRight 0.5s steps(1) infinite; opacity: 0.6; mix-blend-mode: difference; filter: hue-rotate(240deg) invert(1); }
        .clean-logo { font-size: 5.5rem; font-weight: 900; letter-spacing: -2px; color: #252627; margin-bottom: 5px; line-height: 1; }
        .error-sub { font-size: 0.85rem; font-weight: 700; letter-spacing: 5px; color: #a1a1a6; text-transform: uppercase; margin-bottom: 30px; }
        .btn-home { background: #252627; border: 1px solid #252627; color: #ffffff; padding: 14px 35px; border-radius: 8px; font-weight: 700; font-size: 0.9rem; text-decoration: none; text-transform: uppercase; letter-spacing: 2px; transition: all 0.3s ease; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06); display: inline-block; }
        .btn-home:hover { background: #4a4b4d; border-color: #4a4b4d; box-shadow: 0 12px 25px rgba(0, 0, 0, 0.12); }
        @keyframes staticVideoImg { 0%, 100% { transform: translate(0, 0) skewX(0deg); filter: brightness(1); } 10% { transform: translate(-2px, 1px) skewX(-3deg); } 20% { transform: translate(1px, -1px) skewX(5deg); } }
        @keyframes staticVideoImgShiftLeft { 0%, 90%, 100% { transform: translate(0,0); clip-path: inset(0 0 0 0); display: none; } 10% { transform: translate(-8px, 2px) skewX(-15deg); clip-path: inset(20% 0 50% 0); display: block; } }
        @keyframes staticVideoImgShiftRight { 0%, 85%, 100% { transform: translate(0,0); clip-path: inset(0 0 0 0); display: none; } 15% { transform: translate(9px, -3px) skewX(25deg); clip-path: inset(10% 0 75% 0); display: block; } }
    </style>
</head>
<body>

    <nav class="global-navbar"></nav>

    <main class="error-main-wrapper">
        <div class="error-container">
            <div class="glitch-image-container">
                <div class="glitch-image"></div>
                <div class="glitch-image"></div>
                <div class="glitch-image"></div>
            </div>
            <h1 class="clean-logo">404</h1>
            <div class="error-sub">SIGNAL LOST / STATIC ERROR</div>
            <a href="index.html" class="btn-home">Go To Home</a>
        </div>
    </main>

    <div class="global-socials"></div>
    <footer class="global-footer"></footer>

    <script src="global.js"></script>
</body>
</html>
